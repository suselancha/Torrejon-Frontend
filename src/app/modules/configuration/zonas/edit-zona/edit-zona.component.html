<div class="modal-content">
    <!--begin::Modal header-->
    <div class="modal-header" id="kt_modal_add_user_header">
        <!--begin::Modal title-->
        <h2 class="fw-bolder">Modificar Zona</h2>

        <!--end::Modal title-->
        <!--begin::Close-->
        <div class="btn btn-icon btn-sm btn-active-icon-primary" data-kt-users-modal-action="close"
            (click)="modal.dismiss()">
            <!--begin::Svg Icon | path: icons/duotune/arrows/arr061.svg-->
            <span class="svg-icon svg-icon-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)"
                        fill="currentColor" />
                    <rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)"
                        fill="currentColor" />
                </svg>
            </span>
            <!--end::Svg Icon-->
        </div>
        <!--end::Close-->
    </div>
    <!--end::Modal header-->
    <!--begin::Modal body-->
    <div class="modal-body scroll-y mx-5 my-7">
        <!--begin::Form-->
        <form id="kt_modal_add_user_form" class="form" action="#">
            <!--begin::Scroll-->
            <div class="d-flex flex-column scroll-y me-n7 pe-7" id="kt_modal_add_user_scroll" data-kt-scroll="true"
                data-kt-scroll-activate="{default: false, lg: true}" data-kt-scroll-max-height="auto"
                data-kt-scroll-dependencies="#kt_modal_add_user_header"
                data-kt-scroll-wrappers="#kt_modal_add_user_scroll" data-kt-scroll-offset="300px">
                <!--begin::Input group-->
                <div class="fv-row mb-7">
                    <!--begin::Label-->
                    <label class="required fw-bold fs-6 mb-2">Nombre: </label>
                    <!--end::Label-->
                    <!--begin::Input-->
                    <input type="text" name="name" class="form-control form-control-solid mb-3 mb-lg-0"
                        placeholder="Zona" [(ngModel)]="name" />
                    <!--end::Input-->
                </div>
                <div class="fv-row mb-7">
                    <!--begin::Label-->
                    <label class="required fw-bold fs-6 mb-2">Ubicación: </label>
                    <!--end::Label-->
                    <!--begin::Input-->
                    <input type="text" name="location" class="form-control form-control-solid mb-3 mb-lg-0"
                        placeholder="Ubicación" [(ngModel)]="location" />
                    <!--end::Input-->
                </div>
                <div class="fv-row mb-7">
                    <!--begin::Label-->
                    <label class="fw-bold fs-6 mb-2">Descripción:(Opcional) </label>
                    <!--end::Label-->
                    <textarea class="form-control form-control-solid" rows="3" [(ngModel)]="description" name="description" placeholder="Descripción"></textarea>
                </div>
                
                <div class="fv-row mb7">
                    <div class="col-md-4">
                        <!--begin::Label-->
                        <label class="required fw-bold fs-6 mb-2">Región: </label>
                        <!--end::Label-->
                        <!--begin::Select-->
                        <select 
                            class="form-control form-select-solid fw-bolder"
                            name="region_id"
                            [(ngModel)]="region_id"
                        >
                            <option value="0">Selec. Región</option>
                            <ng-container *ngFor="let REGION of REGIONS">
                                <option [value]="REGION.id">{{ REGION.name }}</option>                              
                            </ng-container>
                            
                        </select>
                        <!--end::Select-->
                        <!-- begin::Errors-->
                        <div
                            class="fv-plugins-message-container fv-plugins-message-container--enabled invalid-feedback"
                            *ngIf="errors?.region_id"
                        >
                            <p *ngFor="let error of errors.region_id">{{ error }}</p>
                        </div>
                        <!-- end::Errors-->
                    </div>
                </div>
            </div>
            <!--end::Scroll-->

            <!--begin::Actions-->
            <div class="text-center pt-15">
                <button type="reset" class="btn btn-light me-3" (click)="modal.dismiss()">Cerrar</button>
                <button type="button" (click)="store()" class="btn btn-primary" data-kt-users-modal-action="submit">
                    <span class="indicator-label">Registrar</span>

                    <span class="spinner-border spinner-border-sm align-middle ms-2" *ngIf="isLoading$ | async"></span>
                    <!-- <span class="indicator-progress">Please wait...
                    <span class="spinner-border spinner-border-sm align-middle ms-2"></span></span> -->
                </button>
            </div>
            <!--end::Actions-->
        </form>
        <!--end::Form-->
    </div>
    <!--end::Modal body-->
</div>
